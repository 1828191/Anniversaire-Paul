<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anniversaire Paul</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:auto;padding:20px;text-align:center;background:#fafafa}
.card{background:white;border-radius:12px;padding:30px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
button{padding:12px 24px;margin:10px;border:none;border-radius:8px;cursor:pointer;color:white;font-size:16px}
.yes{background:#28a745}.no{background:#dc3545}
input,textarea{width:100%;padding:10px;margin-top:10px;margin-bottom:20px}
textarea{min-height:100px}
</style>
</head>
<body>
<div class="card">
<h1>🎉 Anniversaire de Paul 🎉</h1>
<h2 id="guestName">Chargement...</h2>
<p>Merci de confirmer votre présence.</p>
<label>Nombre de participants :</label>
<input type="number" id="guestsCount" min="1" value="1">
<label>Commentaire :</label>
<textarea id="comment"></textarea>
<button class="yes" onclick="reply(true)">Je participe</button>
<button class="no" onclick="reply(false)">Je ne participe pas</button>
<div id="result"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
