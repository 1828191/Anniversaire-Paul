<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Les 30 ans de Paul</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
    text-align:center;
}

h1{
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

textarea{
    min-height:120px;
}

.actions{
    margin-top:30px;
}

button{
    border:none;
    border-radius:8px;
    padding:15px 25px;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.yes{
    background:#28a745;
}

.no{
    background:#dc3545;
}

#message{
    margin-top:25px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🎉 Les 30 ans de Paul 🎉</h1>

<h2 id="guestName">Chargement...</h2>

<p>Merci de confirmer votre présence.</p>

<form id="rsvpForm">

<label>Nombre de participants</label>
<input
    type="number"
    id="guestsCount"
    value="1"
    min="1"
>

<label>Allergies / remarques</label>
<textarea
    id="comment"
    placeholder="Indiquez ici vos remarques..."
></textarea>

<div class="actions">

<button
    type="button"
    class="yes"
    onclick="reply(true)">
    ✅ Je participe
</button>

<button
    type="button"
    class="no"
    onclick="reply(false)">
    ❌ Je ne participe pas
</button>

</div>

</form>

<div id="message"></div>

</div>

</div>

https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2script>
app.jsscript>

</body>
</html>
